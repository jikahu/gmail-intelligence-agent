# Render deployment definition. Wired for real use in Phase 16.
#
# Plan: free. This is a personal, single-account project — the $7/month
# Starter plan isn't needed. The trade-off: a free web service spins down
# after 15 minutes with no incoming requests and takes about a minute to
# wake back up, and while asleep the background loops (real-time mail
# polling, the midnight digest scheduler) are asleep too. See
# docs/plain-english/PHASE_16_RENDER_DEPLOYMENT.md for what that means in
# practice and how to upgrade later if it stops being enough.
#
# Free services also can't attach a persistent disk, so local files
# (including the OAuth token file) don't survive a redeploy. That's handled
# in code, not here: GOOGLE_OAUTH_SEED_REFRESH_TOKEN below is what makes the
# Gmail connection survive a redeploy without a paid disk — see
# app/gmail/tokens.py and the plain-English doc for the full explanation.
services:
  - type: web
    name: gmail-intelligence-agent
    runtime: python
    plan: free
    # Installs both AI provider extras so switching AI_PROVIDER between
    # anthropic/openai is just an env var change, never a rebuild.
    buildCommand: pip install -e ".[anthropic,openai]"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Render's native Python service reads this env var to pick the
      # interpreter version (there's no top-level `pythonVersion` Blueprint
      # field for web services — that was a mistake in an earlier version of
      # this file). The committed .python-version file is a second,
      # redundant pin for the same thing.
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DRY_RUN
        value: "true"
      - key: GMAIL_PROCESSING_ENABLED
        value: "false"
      - key: DIGEST_TIMEZONE
        value: America/New_York
      - key: DIGEST_HOUR
        value: "0"
      - key: AI_PROVIDER
        value: anthropic
      - key: REALTIME_ENABLED
        value: "false"
      - key: REALTIME_POLL_INTERVAL_SECONDS
        value: "120"
      # Secrets and deploy-specific values — set in the Render dashboard, do
      # NOT commit real values here. All are blank until you set them.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Render only assigns your service's onrender.com URL after the first
      # deploy. Once you have it, set these two to
      # https://<your-service>.onrender.com/oauth/callback and
      # https://<your-service>.onrender.com/dashboard/auth/callback, and add
      # both as authorized redirect URIs on the Google OAuth client.
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: DASHBOARD_LOGIN_REDIRECT_URI
        sync: false
      - key: SHEETS_WORKBOOK_ID
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Left blank on the very first deploy. After you connect Gmail once on
      # the live site, its callback page shows a refresh token to paste in
      # here — this is what keeps the connection alive across redeploys on a
      # plan with no persistent disk. See
      # docs/plain-english/PHASE_16_RENDER_DEPLOYMENT.md.
      - key: GOOGLE_OAUTH_SEED_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_OAUTH_SEED_ACCOUNT_EMAIL
        sync: false
